name: Push APK to Release

on:
  push:
    branches: [main, master]
    paths:
      - 'kotlin-backend/**'
  workflow_dispatch:

concurrency:
  group: push-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build Android APK & Push Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: '35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Assemble Android APK
        run: ./gradlew :server-android:assembleRelease

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Push APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build (${{ steps.sha.outputs.short }})"
          body: |
            Automated APK build from commit `${{ github.sha }}`

            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.event.head_commit.message }}
            **Timestamp:** ${{ github.event.head_commit.timestamp }}
          files: kotlin-backend/server-android/build/outputs/apk/release/*.apk
          prerelease: true
          make_latest: true
          generate_release_notes: false

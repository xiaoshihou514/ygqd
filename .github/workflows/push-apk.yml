name: Push APK to Release

on:
  push:
    branches: [main, master]
    paths:
      - 'kotlin-backend/**'
      - 'src/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
  workflow_dispatch:

concurrency:
  group: push-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build Vue + Android APK & Push Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Vue dependencies
        run: npm ci

      - name: Build Vue frontend
        run: npm run build-only

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: '35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        working-directory: kotlin-backend
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Assemble Android APK
        working-directory: kotlin-backend
        run: ./gradlew :server-android:assembleDebug

      - name: Verify APK contains Vue frontend
        run: |
          APK=$(ls kotlin-backend/server-android/build/outputs/apk/debug/*.apk | head -1)
          echo "Checking APK: $APK"
          echo "APK size: $(du -h "$APK" | cut -f1)"
          echo ""
          echo "=== Web assets in APK ==="
          unzip -l "$APK" | grep -E 'assets/web/' || echo "WARNING: No web assets found!"
          echo ""
          echo "=== HTML files ==="
          unzip -l "$APK" | grep '\.html$' || echo "WARNING: No HTML files found!"

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Push APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build (${{ steps.sha.outputs.short }})"
          body: |
            Automated APK build from commit `${{ github.sha }}`

            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.event.head_commit.message }}
            **Timestamp:** ${{ github.event.head_commit.timestamp }}
          files: kotlin-backend/server-android/build/outputs/apk/debug/*.apk
          prerelease: true
          make_latest: true
          generate_release_notes: false

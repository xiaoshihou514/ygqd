name: Linux Nightly

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: linux-nightly
  cancel-in-progress: true

permissions:
  contents: write

env:
  # linuxdeploy 自带的旧版 strip 无法识别新版 binutils 产出的 .relr.dyn 段
  NO_STRIP: 1
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  build:
    name: Build Linux desktop nightly
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run type-check

      - name: Build AppImage
        run: npm run desktop:build

      - name: Verify and stage packages
        id: artifact
        run: |
          mkdir -p artifacts
          appimage="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          # release 资产名会丢弃非 ASCII 字符,统一复制为稳定的 ASCII 文件名
          cp "$appimage" artifacts/ygqd-linux-x86_64.AppImage
          cd artifacts
          sha256sum ygqd-linux-x86_64.AppImage > ygqd-linux-x86_64.AppImage.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ygqd-linux-nightly-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

      - name: Move nightly tag
        run: |
          git tag --force nightly "$GITHUB_SHA"
          # 安卓流水线可能同时移动该标签,竞争失败可忽略,由 release upsert 兜底
          git push --force origin refs/tags/nightly || true

      - name: Publish rolling nightly release
        uses: softprops/action-gh-release@v3
        # 安卓/Linux 流水线并发发布同一 nightly release 时存在竞争
        # 失败窗口(softprops 内部 create/upsert),由下一步幂等补传兜底
        continue-on-error: true
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Automated nightly from `${{ github.sha }}`.

            安卓 APK 与 Linux AppImage 由两条流水线分别发布到本 release,
            任一缺失说明对应构建尚未完成或失败。

            This release is replaced by the next successful nightly build.
          files: artifacts/*
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Verify and repair release assets
        run: |
          # 幂等补齐:确保 release 存在(并发竞争下 softprops 可能创建失败),
          # 再 --clobber 补传资产,最多重试 3 次,全部失败才判红
          gh release view nightly >/dev/null 2>&1 || \
            gh release create nightly \
              --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Nightly Build" \
              --notes "Automated nightly from \`$GITHUB_SHA\`."
          for attempt in 1 2 3; do
            if gh release upload nightly artifacts/* --clobber; then
              echo "release 资产已就位(第 $attempt 次尝试)"
              exit 0
            fi
            echo "第 $attempt 次补传失败,退避 15 秒后重试"
            sleep 15
          done
          echo "release 资产补传失败"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

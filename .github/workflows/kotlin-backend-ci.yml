name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test Core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Tests
        run: ./gradlew :core:test -PexcludeIntegration

  build-desktop:
    name: Build Desktop Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Vue dependencies
        run: npm ci

      - name: Build Vue frontend
        run: npm run build-only

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Desktop Server
        working-directory: kotlin-backend
        run: ./gradlew :server-desktop:compileKotlin

      - name: Assemble Distribution
        working-directory: kotlin-backend
        run: ./gradlew :server-desktop:installDist

      - name: Verify Desktop package
        run: |
          echo "=== Desktop dist files ==="
          ls -la kotlin-backend/server-desktop/build/install/server-desktop/
          echo ""
          echo "=== Web files in dist ==="
          find kotlin-backend/server-desktop/build/install/server-desktop/web -type f || echo "No web dir"

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-desktop-dist
          path: kotlin-backend/server-desktop/build/install/

  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Vue dependencies
        run: npm ci

      - name: Build Vue frontend
        run: npm run build-only

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: '35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        working-directory: kotlin-backend
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Compile Android App
        working-directory: kotlin-backend
        run: ./gradlew :server-android:compileReleaseKotlin

      - name: Assemble Android APK
        working-directory: kotlin-backend
        run: ./gradlew :server-android:assembleRelease

      - name: Verify APK contains Vue frontend
        run: |
          APK=$(ls kotlin-backend/server-android/build/outputs/apk/release/*.apk | head -1)
          echo "Checking APK: $APK"
          echo "APK size: $(du -h "$APK" | cut -f1)"
          echo ""
          echo "=== Web assets in APK ==="
          unzip -l "$APK" | grep -E 'assets/web/' || echo "WARNING: No web assets found!"
          echo ""
          echo "=== HTML files ==="
          unzip -l "$APK" | grep '\.html$' || echo "WARNING: No HTML files found!"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: server-android-apk
          path: kotlin-backend/server-android/build/outputs/apk/release/*.apk

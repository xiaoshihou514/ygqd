name: Android Nightly

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-nightly
  cancel-in-progress: true

permissions:
  contents: write

env:
  NDK_VERSION: 27.2.12479018
  BUILD_TOOLS_VERSION: 36.1.0

jobs:
  build:
    name: Build signed Android nightly
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 不用 android-actions/setup-android:其内置 cmdline-tools 16.0 已装不上
      # legacy `tools` 包(action 上游回归);runner 预装 SDK 足够,直接自装工具链
      - name: Install Android toolchain
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;$BUILD_TOOLS_VERSION" \
            "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          # boring-sys2(wreq 的 BoringSSL)按 ANDROID_NDK_HOME 定位交叉编译工具链
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run type-check

      - name: Initialize Android project
        run: |
          npm run android:init
          # 本地流代理走 http://127.0.0.1(release 默认禁明文),放开
          sed -i 's/manifestPlaceholders\["usesCleartextTraffic"\] = "false"/manifestPlaceholders["usesCleartextTraffic"] = "true"/' src-tauri/gen/android/app/build.gradle.kts

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64 repository secret}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD repository secret}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS repository secret}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD repository secret}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
          node scripts/configure-android-signing.mjs

      - name: Build signed APK
        run: npm run android -- --target aarch64 --target armv7 --apk

      - name: Verify and stage APK
        id: artifact
        run: |
          source_apk="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          test -f "$source_apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$source_apk"
          mkdir -p artifacts
          artifact="artifacts/ygqd-nightly.apk"
          cp "$source_apk" "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"
          echo "apk=$artifact" >> "$GITHUB_OUTPUT"
          echo "checksum=$artifact.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ygqd-nightly-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

      - name: Move nightly tag
        run: |
          git tag --force nightly "$GITHUB_SHA"
          # Linux 流水线可能同时移动该标签,竞争失败可忽略,由 release upsert 兜底
          git push --force origin refs/tags/nightly || true

      - name: Publish rolling nightly release
        uses: softprops/action-gh-release@v3
        # Linux 流水线并发发布同一 nightly release 时存在竞争失败窗口
        # (softprops 内部 create/upsert),由下一步幂等补传兜底
        continue-on-error: true
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Automated nightly from `${{ github.sha }}`.

            安卓 APK 与 Linux AppImage 由两条流水线分别发布到本 release,
            任一缺失说明对应构建尚未完成或失败。

            This release is replaced by the next successful nightly build.
          files: |
            ${{ steps.artifact.outputs.apk }}
            ${{ steps.artifact.outputs.checksum }}
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Verify and repair release assets
        run: |
          # 幂等补齐:确保 release 存在(并发竞争下 softprops 可能创建失败),
          # 再 --clobber 补传资产,最多重试 3 次,全部失败才判红
          gh release view nightly >/dev/null 2>&1 || \
            gh release create nightly \
              --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Nightly Build" \
              --notes "Automated nightly from \`$GITHUB_SHA\`."
          for attempt in 1 2 3; do
            if gh release upload nightly \
              "${{ steps.artifact.outputs.apk }}" \
              "${{ steps.artifact.outputs.checksum }}" \
              --clobber; then
              echo "release 资产已就位(第 $attempt 次尝试)"
              exit 0
            fi
            echo "第 $attempt 次补传失败,退避 15 秒后重试"
            sleep 15
          done
          echo "release 资产补传失败"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

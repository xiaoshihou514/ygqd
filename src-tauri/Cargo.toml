[package]
name = "ygqd"
version = "0.1.0"
description = "Android comic browser"
edition = "2021"

[lib]
name = "ygqd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "cookies", "json", "blocking"] }
# missav 按客户端 TLS 指纹拦截(403),wreq 模拟 Chrome 指纹直连(内部为
# BoringSSL,Android 交叉编译需环境变量 ANDROID_NDK_HOME)
wreq = "0.15"
wreq-util = "0.1"
scraper = "0.24"
regex = "1"
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.23.1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# 发布构建:单编译单元 + thin LTO 换更小更快的 .so/可执行文件;
# strip 去符号表(JNI 导出在 .dynsym,不受影响);panic 维持默认 unwind
[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
strip = true

# 开发构建:依赖(scraper/regex/rustls 等)开优化,本 crate 保持 opt-level 0
# 以维持增量编译速度;调试期 HTML 解析与 TLS 握手不再明显卡顿
[profile.dev.package."*"]
opt-level = 2

